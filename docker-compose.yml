services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docintel}
      POSTGRES_USER: ${POSTGRES_USER:-docintel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docintel_password_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docintel_user} -d ${POSTGRES_DB:-docintel}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - docintel-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_password_change_me}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password_change_me}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - docintel-net

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-docintel}
      - POSTGRES_USER=${POSTGRES_USER:-docintel_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-docintel_password_change_me}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password_change_me}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - PRIMARY_LLM_MODEL=${PRIMARY_LLM_MODEL:-gemini-3.8-flash}
      - FALLBACK_LLM_MODEL=${FALLBACK_LLM_MODEL:-gemini-3.1-pro-preview}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini-embedding-001}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1536}
      - OCR_LANG=${OCR_LANG:-eng}
      - DATA_UPLOADS_DIR=/data/uploads
    volumes:
      - uploads:/data/uploads:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - docintel-net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-docintel}
      - POSTGRES_USER=${POSTGRES_USER:-docintel_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-docintel_password_change_me}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password_change_me}
      - API_KEY=${API_KEY:-docintel-test-api-key-2026-secure-token}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-200}
      - WORKER_INTERNAL_URL=http://worker:8001
      - DATA_UPLOADS_DIR=/data/uploads
    volumes:
      - uploads:/data/uploads:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:4000/health\", (r) => process.exit(r.statusCode === 200 ? 0 : 1))' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - docintel-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - API_INTERNAL_URL=http://api:4000
      - API_KEY=${API_KEY:-docintel-test-api-key-2026-secure-token}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:3000/api/health\", (r) => process.exit(r.statusCode === 200 ? 0 : 1))' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - docintel-net

  tests:
    profiles: ["test"]
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    user: "10001:10001"
    environment:
      - API_BASE_URL=http://api:4000
      - API_KEY=${API_KEY:-docintel-test-api-key-2026-secure-token}
      - WORKER_INTERNAL_URL=http://worker:8001
      - LLM_PROVIDER=mock
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-docintel}
      - POSTGRES_USER=${POSTGRES_USER:-docintel_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-docintel_password_change_me}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password_change_me}
    volumes:
      - ./tests:/app/tests:ro
      - uploads:/data/uploads:rw
    command: ["pytest", "-v"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - docintel-net

networks:
  docintel-net:
    driver: bridge

volumes:
  pgdata:
  uploads:
